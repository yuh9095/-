name: OTA module extraction and source audit

on:
  workflow_dispatch:
    inputs:
      ota_path:
        description: OTA ZIP path inside this repository
        required: false
        default: 原版固件/860.zip
        type: string
      ota_url:
        description: Optional direct HTTPS OTA URL (overrides ota_path)
        required: false
        type: string
      ota_sha256:
        description: Optional expected SHA-256 of the OTA ZIP
        required: false
        type: string
      source_ref:
        description: OnePlus source branch
        required: true
        default: oneplus/sm8650_v_15.0.0_oneplus12
        type: string

permissions:
  contents: read

concurrency:
  group: ota-module-audit
  cancel-in-progress: false

jobs:
  extract-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit repository
        uses: actions/checkout@v4

      - name: Download OTA and install extraction tools
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
          OTA_PATH: ${{ inputs.ota_path }}
          OTA_SHA256: ${{ inputs.ota_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p work/ota work/extracted reports/ota-module-audit
          if [[ -n "$OTA_URL" ]]; then
            case "$OTA_URL" in
              https://*) ;;
              *) echo "Only HTTPS OTA URLs are accepted"; exit 2 ;;
            esac
            curl --fail --location --retry 3 --retry-delay 2 "$OTA_URL" -o work/ota.zip
          else
            case "$OTA_PATH" in
              ""|/*|..|../*|*/../*|*/..) echo "Unsafe or empty OTA_PATH"; exit 2 ;;
            esac
            if [[ ! -f "$GITHUB_WORKSPACE/$OTA_PATH" ]]; then
              echo "OTA file not found in repository: $OTA_PATH"
              exit 2
            fi
            cp "$GITHUB_WORKSPACE/$OTA_PATH" work/ota.zip
          fi
          echo "Downloaded OTA SHA-256:"
          sha256sum work/ota.zip
          if [[ -n "$OTA_SHA256" ]]; then
            echo "$OTA_SHA256  work/ota.zip" | sha256sum --check -
          fi
          python3 - <<'PY'
          import pathlib, zipfile
          target = pathlib.Path("work/ota")
          with zipfile.ZipFile("work/ota.zip") as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path: " + item.filename)
                  if item.is_dir():
                      continue
                  dest = target.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(item) as src, dest.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          PY
          sudo apt-get update
          sudo apt-get install -y erofs-utils kmod unzip lz4 cpio file
          fsck.erofs --version
          modinfo --version

      - name: Checkout matching OnePlus source trees
        uses: actions/checkout@v4
        with:
          repository: yuh9095/android_kernel_common_oneplus_sm8650
          ref: ${{ inputs.source_ref }}
          path: source-common
          fetch-depth: 1

      - name: Checkout Qualcomm msm-kernel source
        uses: actions/checkout@v4
        with:
          repository: yuh9095/android_kernel_oneplus_sm8650
          ref: ${{ inputs.source_ref }}
          path: source-msm
          fetch-depth: 1

      - name: Checkout modules and device tree source
        uses: actions/checkout@v4
        with:
          repository: yuh9095/android_kernel_modules_and_devicetree_oneplus_sm8650
          ref: ${{ inputs.source_ref }}
          path: source-modules
          fetch-depth: 1

      - name: Extract DLKM EROFS images
        shell: bash
        run: |
          set -euo pipefail
          extract_partition() {
            local partition="$1"
            local image
            image="$(find work/ota -type f -name "$partition.img" -print -quit)"
            if [[ -z "$image" ]]; then
              echo "Missing $partition.img in OTA ZIP"
              return 1
            fi
            local dest="work/extracted/$partition"
            mkdir -p "$dest"
            echo "Extracting $image"
            fsck.erofs --extract="$dest" "$image"
          }
          extract_partition vendor_dlkm
          extract_partition system_dlkm

      - name: Unpack vendor_boot ramdisk fragments
        shell: bash
        run: |
          set -euo pipefail
          image="$(find work/ota -type f -name 'vendor_boot.img' -print -quit || true)"
          if [[ -z "$image" ]]; then
            echo "vendor_boot.img not present; skipping ramdisk extraction"
            exit 0
          fi
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg
          mkdir -p work/vendor_boot_unpacked work/extracted/vendor_boot_ramdisk
          python3 work/mkbootimg/unpack_bootimg.py --boot_img "$image" --out work/vendor_boot_unpacked
          index=0
          while IFS= read -r -d '' ramdisk; do
            [[ -s "$ramdisk" ]] || continue
            tmp="$RUNNER_TEMP/vendor_ramdisk_${index}.cpio"
            dest="work/extracted/vendor_boot_ramdisk/fragment_${index}"
            mkdir -p "$dest"
            if lz4 -t "$ramdisk" >/dev/null 2>&1; then
              lz4 -d -f "$ramdisk" "$tmp"
            elif gzip -t "$ramdisk" >/dev/null 2>&1; then
              gzip -dc "$ramdisk" > "$tmp"
            else
              cp "$ramdisk" "$tmp"
            fi
            (cd "$dest" && cpio -idm --no-absolute-filenames < "$tmp")
            index=$((index + 1))
          done < <(find work/vendor_boot_unpacked -type f -iname '*ramdisk*' -print0)
          echo "Unpacked $index vendor ramdisk fragment(s)"

      - name: Compare OTA modules with source inventory and symbol CRCs
        shell: bash
        env:
          OTA_EXTRACT: ${{ github.workspace }}/work/extracted
        run: |
          set -euo pipefail
          python3 scripts/analyze_ota_modules.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-module-audit-${{ github.run_number }}
          path: reports/ota-module-audit/
          if-no-files-found: warn
          retention-days: 14
